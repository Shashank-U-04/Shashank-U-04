# Redraws the "Languages by repo count" card (assets/langs-*.svg) from my public repos.
name: Languages card

on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/langs.yml, .github/scripts/lang_card.py]

permissions:
  contents: write

concurrency: langs

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Draw the card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/lang_card.py "${{ github.repository_owner }}" assets
      - name: Commit the card if it changed
        shell: bash
        run: |
          git add assets/langs-light.svg assets/langs-dark.svg
          if git diff --cached --quiet; then
            echo "The card is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "langs: redraw languages card"
          git pull --rebase --quiet
          git push --quiet
